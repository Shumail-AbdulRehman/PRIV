const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.review}</svg>`;

let saved=false,selectedIssue='dark',action='';
const navItems=[['overview','grid','Overview'],['today','calendar','Today'],['reviews','review','Reviews']];

function metric(label,value,detail,href,extra=''){return `<a class="metric ${extra}" href="${href}"><span class="metric-top">${label}${icon('arrow')}</span><strong class="metric-value">${value}</strong><small>${detail}</small></a>`;}
const taskRows=[['Ground floor washroom','Morning cleaning · Ali Raza','Submitted','amber','Needs your decision','#case'],['Reception & corridors','Morning cleaning · Sana Ahmed','In progress','blue','Work underway','#today?tab=tasks'],['Second floor washroom','Morning cleaning · Bilal Khan','Overdue','red','Not submitted','#today?tab=tasks&status=overdue']];
function overview(){return header('Overview','Monday, 12 October 2026 · Updated 10:42 am')+`<section class="metrics" aria-label="Today’s summary">${metric('Staff present','18 <span>of 24</span>','Scheduled staff today','#today?tab=staff&attendance=present')}${metric('Tasks due today','24','Includes unassigned work','#today?tab=tasks')}${metric('Work submitted','14 <span>of 24</span>','Submission is separate from approval','#today?tab=tasks&status=submitted')}${metric('Waiting for review','3','Cases from today’s work','#reviews?period=today','metric-attention')}</section><section class="panel"><div class="panel-head"><div><h2>Needs your attention</h2><p>Start with these items from today.</p></div><a class="text-link" href="#today">See today’s work ${icon('arrow')}</a></div><div class="issue-row"><span class="symbol danger">${icon('clock')}</span><div><strong>Second floor washroom is overdue</strong><p>Bilal Khan · Gulberg office · Due 10:00 am</p></div>${link('#today?tab=tasks&status=overdue','Open task')}</div><div class="issue-row"><span class="symbol">${icon('users')}</span><div><strong>Ayesha has not checked in</strong><p>Gulberg office · Shift started at 8:00 am</p></div>${link('#today?tab=staff&attendance=absent','Check attendance')}</div><div class="issue-row"><span class="symbol">${icon('camera')}</span><div><strong>Ground floor washroom</strong><p><span class="reason">Photo is too dark</span> · Ali Raza · Morning cleaning</p></div>${link('#case','Review','primary')}</div></section><div class="columns"><section class="panel"><div class="panel-head"><div><h2>Cleaning progress today</h2><p>12 October · Gulberg office · 24 tasks</p></div></div><div class="chart">${[['Submitted',14,100,''],['In progress',5,36,'blue'],['Not started',3,22,'gray'],['Overdue',2,14,'amber']].map(([label,n,w,c])=>`<div class="chart-row"><span>${label}</span><div class="track"><div class="fill ${c}" style="width:${w}%"></div></div><strong>${n}</strong></div>`).join('')}<div class="chart-summary"><span><strong>10</strong> verified</span><span><strong>1</strong> accepted with exceptions</span></div><p class="footnote" style="margin-top:10px">Submitted work may still need checks or your decision.</p></div></section><section class="panel"><div class="panel-head"><h2>Today’s tasks</h2><a class="text-link" href="#today?tab=tasks">View all 24 ${icon('arrow')}</a></div><div class="simple-list">${taskRows.map(r=>`<a class="task-row" href="${r[5]}"><div><strong>${r[0]}</strong><p>${r[1]}</p></div><span class="pill ${r[3]}">${r[2]} ${icon('arrow')}</span></a>`).join('')}</div></section></div>`;}
function pagination(total){return `<div class="pagination"><span>Showing ${total} sample records</span><div><button class="btn" disabled>Previous</button><span class="btn" aria-current="page">1</span><button class="btn" disabled>Next</button></div></div>`;}
function today(params){const tab=params.get('tab')||'staff',filter=params.get('attendance')||params.get('status')||'all';let rows=tab==='staff'?[['Ali Raza','08:00 am – 04:00 pm','Present','', '2 of 3 submitted'],['Ayesha Siddiqui','08:00 am – 04:00 pm','Not checked in','red','0 of 2 submitted'],['Sana Ahmed','08:00 am – 04:00 pm','Present','','1 of 2 submitted']]:taskRows;if(tab==='staff'&&filter==='present')rows=rows.filter(r=>r[2]==='Present');if(tab==='staff'&&filter==='absent')rows=rows.filter(r=>r[2]==='Not checked in');if(tab==='tasks'&&filter==='submitted')rows=rows.filter(r=>r[2]==='Submitted');if(tab==='tasks'&&filter==='overdue')rows=rows.filter(r=>r[2]==='Overdue');return header('Today','Your team and cleaning work · Times in Asia/Karachi')+`<div class="tabs"><a class="tab ${tab==='staff'?'active':''}" href="#today?tab=staff">Staff <span>24</span></a><a class="tab ${tab==='tasks'?'active':''}" href="#today?tab=tasks">Tasks <span>24</span></a></div><div class="toolbar"><label class="field search">Find ${tab==='staff'?'a worker':'a task'}<input id="record-search" placeholder="Search ${tab==='staff'?'name':'room, task or worker'}" oninput="filterRows(this.value)"></label><label class="field">${tab==='staff'?'Attendance':'Work status'}<select onchange="location.hash='today?tab=${tab}&${tab==='staff'?'attendance':'status'}='+this.value">${(tab==='staff'?[['all','All staff'],['present','Present'],['absent','Not checked in']]:[['all','All tasks'],['submitted','Submitted'],['overdue','Overdue']]).map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select></label></div><section class="panel"><div class="table-wrap"><table><thead><tr>${(tab==='staff'?['Worker','Shift','Attendance','Cleaning progress','']:['Area / task','Worker / schedule','Work status','Review status','']).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>tab==='staff'?`<tr class="filter-row"><td><strong>${r[0]}</strong><p>Gulberg office</p></td><td data-label="Shift">${r[1]}</td><td data-label="Attendance"><span class="pill ${r[3]}">${r[2]}</span></td><td data-label="Work">${r[4]}</td><td><button class="btn" onclick="showWorker('${r[0]}')">View worker ${icon('arrow')}</button></td></tr>`:`<tr class="filter-row"><td><strong>${r[0]}</strong><p>Gulberg office</p></td><td data-label="Scheduled work">${r[1]}<p>09:00–10:00 am</p></td><td data-label="Work"><span class="pill ${r[3]}">${r[2]}</span></td><td data-label="Review">${r[4]}</td><td>${r[2]==='Submitted'?link('#case','Review'): `<button class="btn" onclick="showWorker('${r[0]}')">Open task ${icon('arrow')}</button>`}</td></tr>`).join('')}</tbody></table></div>${pagination(rows.length)}</section><div id="record-detail"></div><p class="note">Earlier unresolved cases are kept in <a class="brand bold" href="#reviews?period=earlier">Reviews ${icon('arrow')}</a></p>`;}
function reviews(params){let period=params.get('period')||'all';return header('Reviews','See the reason. Check the photos. Choose the next step.')+`<div class="tabs"><span class="tab active">Needs my decision <span>${'4'}</span></span><span class="tab">Waiting for staff <span>${'2'}</span></span><span class="tab">Checks pending <span>1</span></span><span class="tab">Resolved</span></div><div class="toolbar"><label class="field search">Find a review<input placeholder="Search room, worker or task" oninput="filterRows(this.value)"></label><label class="field">Room<select><option>All rooms</option></select></label><label class="field">Period<select onchange="location.hash='reviews?period='+this.value">${[['all','All dates'],['today','Today'],['earlier','Earlier work']].map(([v,l])=>`<option value="${v}" ${v===period?'selected':''}>${l}</option>`).join('')}</select></label></div>${period==='all'?'<p class="note">3 cases from today · 1 from earlier work. Earlier issues stay here until handled.</p>':''}<section class="panel"><div class="table-wrap"><table><thead><tr><th>Area / task</th><th>Why it needs you</th><th>Worker</th><th>Scheduled</th><th></th></tr></thead><tbody>${[['Ground floor washroom','Morning cleaning','Photo is too dark','1 other issue','Ali Raza','12 Oct · 10:00 am','today'],['Reception washroom','Morning cleaning','Automatic check could not finish','Photo received; no dirty finding','Sana Ahmed','12 Oct · 09:30 am','today'],['Second floor washroom','Afternoon cleaning','Required photo is missing','Sink basin / drain / tap','Bilal Khan','12 Oct · 02:00 pm','today'],['Basement washroom','Evening cleaning','Cleaning needs your check','Earlier unresolved work','Ali Raza','11 Oct · 06:00 pm','earlier']].filter(r=>period==='all'||r[6]===period).map(r=>`<tr class="filter-row"><td><strong>${r[0]}</strong><p>${r[1]} · Gulberg office</p></td><td data-label="Reason"><strong>${r[2]}</strong><p>${r[3]}</p></td><td data-label="Worker">${r[4]}</td><td data-label="Scheduled">${r[5]}${r[6]==='earlier'?'<p><span class="pill gray">Earlier work</span></p>':''}</td><td>${link('#case', 'Review','primary')}</td></tr>`).join('')}</tbody></table></div>${pagination(period==='all'?4:period==='today'?3:1)}</section>`;}
const illustration=`<svg viewBox="0 0 620 340" role="img" aria-label="Illustration showing a dimly lit basin, not real evidence"><defs><pattern id="tiles" width="100" height="85" patternUnits="userSpaceOnUse"><rect width="100" height="85" fill="#677879" stroke="#526568" stroke-width="1"/></pattern></defs><rect width="620" height="340" fill="url(#tiles)"/><path d="M125 95h370l-24 173H152Z" fill="#778c8d"/><ellipse cx="310" cy="128" rx="176" ry="60" fill="#bfcbcb"/><ellipse cx="310" cy="129" rx="128" ry="40" fill="#92a4a5"/><ellipse cx="310" cy="145" rx="72" ry="22" fill="#72898c"/><ellipse cx="310" cy="145" rx="12" ry="5" fill="#364e54"/><path d="M310 91V46q0-17 20-17h13" fill="none" stroke="#b7c5c8" stroke-width="16"/><path d="M281 57h-30m103 0h26" stroke="#c0cece" stroke-width="9"/><path d="M178 238h269l-26 79H199Z" fill="#7b9091"/><rect width="620" height="340" fill="#102126" opacity=".27"/></svg><span class="watermark">ILLUSTRATION · NOT CUSTOMER EVIDENCE</span>`;
function casePage(){const missing=selectedIssue==='missing';return `<div class="back"><a class="text-link" href="#reviews">${icon('back')} Back to reviews</a></div><div class="case-header"><div><h1>Ground floor washroom</h1><div class="case-meta"><span>${icon('pin')} Gulberg office</span><span>${icon('users')} Ali Raza</span><span>${icon('clock')} 12 Oct · 09:00–11:00 am</span></div></div>${link('#reviews','Next review')}</div><div class="workflow-line"><span class="pill amber">Needs your decision</span><span>Work in progress</span><span>·</span><span>Photo window ends at 11:00 am</span></div>${saved?'<div class="success">'+icon('check')+'<div><strong>Demo decision saved</strong><p>One issue still needs your decision. Choose the missing-photo issue to continue.</p></div></div>':''}<div class="issue-tabs"><button class="${!missing?'active':''}" onclick="selectedIssue='dark';render()">${icon('camera')} Photo is too dark</button><button class="${missing?'active':''}" onclick="selectedIssue='missing';render()">${icon('alert')} Missing sink photo</button></div><div class="review-grid"><section class="panel evidence"><div class="evidence-top"><div><h2>${missing?'Sink 02':'Sink 01'}</h2><p>Basin, drain and tap · Required view</p></div><span class="pill ${missing?'gray':'amber'}">${missing?'Not received':'Needs checking'}</span></div>${missing?`<div class="image-stage empty">${icon('camera')}<strong>No photo received for this view</strong><p>Check the missing requirement below. A photo saved only on the worker’s phone will appear after upload.</p></div>`:`<div class="image-stage">${illustration}</div>`}<div class="evidence-caption"><span>${missing?'Required photo is still missing':'Received 10:03 am · Photo 1 of 3'}</span>${!missing?'<button class="btn quiet" onclick="enlarge()">'+icon('expand')+' Enlarge photo</button>':''}</div><div class="instruction"><strong>What this photo must show</strong>Show the entire basin, drain and tap. Keep all required surfaces clearly visible.</div><div class="requirements"><h3>All required photos</h3><div class="requirement"><span>Sink 01 · Basin, drain and tap</span><span class="pill amber">Needs review</span></div><div class="requirement"><span>Sink 02 · Basin, drain and tap</span><span class="pill gray">Missing</span></div><div class="requirement"><span>Room entrance</span><span class="pill">Received</span></div></div></section><section class="panel action-panel"><span class="pill amber">Issue ${missing?'2':'1'} of 2</span><h2>${missing?'Required photo is missing':'Photo is too dark'}</h2><p>${missing?'The second sink has no received photo. Its required view remains unfinished.':'The basin and drain are hard to see. Check whether a brighter photo is needed.'}</p><p class="explanation">You can review the other required photos on this page.</p><div class="action-heading">What should happen next?</div><button class="action-choice" onclick="chooseAction('photo')">${missing?'Review available next steps':'Ask for another photo'}${icon('arrow')}</button>${!missing?'<button class="action-choice" onclick="chooseAction(\'accept\')">Accept this photo'+icon('check')+'</button>':''}<p class="explanation">${missing?'This issue can close after the missing requirement is satisfied. Check the available photo time before arranging more work.':'Accept only if you can clearly assess all the required surfaces in this photo.'}</p><details style="margin-top:16px"><summary class="small brand" style="cursor:pointer">Other actions</summary><p class="explanation">A repair report keeps the photo requirement open. Making an exception requires a reason and is recorded in review history.</p></details><div class="decision hidden"><h3 id="decision-title">${missing?'Missing-photo next step':'Ask for another photo'}</h3><p class="explanation" id="decision-consequence">${missing?'The photo window is open until 11:00 am. This requirement still needs a photo.':'The worker will be asked to take a clearer photo. This issue stays open while you wait.'}</p><label class="field" style="margin-top:12px">Short note for the worker<textarea id="decision-note">Please use brighter light and show the whole basin and drain.</textarea></label><button class="btn primary" onclick="saveDemo()">${icon('check')} Preview saved state</button></div></section></div><details class="panel history"><summary>Previous decisions and earlier photos</summary><p>No earlier decisions in this sample. Production shows the audited manager, decision, reason and local date/time here.</p></details>`;}
function chooseAction(value){action=value;document.querySelector('.decision').classList.remove('hidden');document.getElementById('decision-title').textContent=value==='accept'?'Accept this photo':'Ask for another photo';document.getElementById('decision-consequence').textContent=value==='accept'?'Manual acceptance may contribute to completion with exceptions. It does not mean automatically verified.':'The requirement stays open until valid replacement evidence is received.';document.querySelectorAll('.action-choice').forEach((el,i)=>el.classList.toggle('selected',i===(value==='accept'?1:0)));}
function saveDemo(){saved=true;render();window.scrollTo({top:0,behavior:'instant'});}
function enlarge(){document.getElementById('large-image').innerHTML=illustration;document.getElementById('viewer').showModal();}
function filterRows(value){document.querySelectorAll('.filter-row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(value.toLowerCase()));}
function showWorker(name){const node=document.getElementById('record-detail');node.className='panel history';node.innerHTML='<h2></h2><p>In production, this panel loads the exact authorized worker or task, scoped to the selected local day. This preview demonstrates keeping the record alongside the list.</p><button class="btn" style="margin-top:15px" onclick="this.parentElement.className=\'\';this.parentElement.innerHTML=\'\'">Close details</button>';node.querySelector('h2').textContent=name;node.scrollIntoView({block:'nearest'});}
function render(){const [raw,query]=location.hash.slice(1).split('?'),page=['overview','today','reviews','case'].includes(raw)?raw:'overview',params=new URLSearchParams(query);navigation(page);document.getElementById('content').innerHTML=({overview,today:()=>today(params),reviews:()=>reviews(params),case:casePage}[page])()+sampleFooter;document.title='Hygene Ops · '+(page==='case'?'Review workspace':page)+' · Design preview';}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>
</body>
