services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-environment
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      VERIFICATION_QR_SECRET: ${VERIFICATION_QR_SECRET:-}
      VERIFICATION_SLOT_SECRET: ${VERIFICATION_SLOT_SECRET:-}
      VERIFICATION_MIN_NATIVE_VERSION: ${VERIFICATION_MIN_NATIVE_VERSION:-2.0.0}
      VERIFICATION_SPATIAL_RECAPTURE_ENABLED: ${VERIFICATION_SPATIAL_RECAPTURE_ENABLED:-false}
      VERIFICATION_QR_KEY_ID: ${VERIFICATION_QR_KEY_ID:-v1}
      MAX_TASK_REASSIGNMENTS: ${MAX_TASK_REASSIGNMENTS:-3}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLEF_MODEL: ${CLEF_MODEL:-clef}
      CLEF_TIMEOUT_MS: ${CLEF_TIMEOUT_MS:-30000}
      CLEF_CONFIDENCE_THRESHOLD: ${CLEF_CONFIDENCE_THRESHOLD:-}
      CLEF_THRESHOLD_VERSION: ${CLEF_THRESHOLD_VERSION:-unvalidated-no-threshold}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  mobile-web:
    profiles:
      - mobile-web
    image: ${MOBILE_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${MOBILE_WEB_PORT:-8081}:80"

  verification-worker:
    image: ${BACKEND_IMAGE:-shumail47891/fyp:backend}
    restart: unless-stopped
    command: ["node", "dist/workers/verificationWorker.js"]
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "dist/workers/verificationWorkerHealth.js"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment: *backend-environment

volumes:
  postgres_data:
