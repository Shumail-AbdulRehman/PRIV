name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: priv_verification_test
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: verification-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verification -d priv_verification_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      VERIFICATION_TEST_DATABASE_URL: postgresql://verification:verification-test-only@127.0.0.1:5432/priv_verification_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Backend regression tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Check worker entry points
        run: npm run worker:verification:check

      - name: Isolated database contracts and races
        run: npm run test:verification:integration && npm run test:verification:lifecycle

      - name: Worker startup and health
        run: npm run test:verification:worker

      - name: Preserve evaluator gate
        run: npm run verification:benchmark

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test onboarding rules
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  mobile-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mobile queue, force-kill and auth reliability tests
        run: npm test

      - name: Type-check mobile app
        run: npm run typecheck

      - name: Build Expo web bundle
        run: npm run build:web

  docker-builds:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - mobile-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: cleanops-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: cleanops-frontend:ci
          build-args: |
            VITE_API_BASE_URL=/api

      - name: Build mobile web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-mobile
          file: ./frontend-mobile/Dockerfile
          push: false
          load: true
          tags: cleanops-mobile-web:ci
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=/api
