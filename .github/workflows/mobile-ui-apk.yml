name: Mobile UI APK
on:
  push:
    branches: ['build/hygeneops-ui-native-*']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      EXPO_PUBLIC_API_BASE_URL: http://192.168.100.198:8080/api
      NODE_OPTIONS: --max-old-space-size=4096
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    defaults:
      run:
        working-directory: frontend-mobile
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: frontend-mobile/package-lock.json
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"'
      - run: npm ci
      - name: Validate mobile source and phone configuration
        run: npm run validate:device-config && npm run typecheck && npm test
      - name: Generate native project including speech
        run: |
          npx expo prebuild --platform android --no-install
          mkdir -p build-output
          npx expo-modules-autolinking resolve --platform android --json > build-output/autolinking.json
          node -e "const m=require('./build-output/autolinking.json').modules.map(m=>m.packageName); for(const n of ['expo-speech','expo-camera','expo-sqlite','capture-quality']) if(!m.includes(n))throw new Error('Missing '+n)"
      - name: Build standalone release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2 --console=plain 2>&1 | tee ../build-output/native-build.log
          cp app/build/outputs/apk/release/app-release.apk ../build-output/HygeneOps-staff-2.1.3-ui.apk
      - name: Inspect compiled APK
        run: |
          python3 scripts/inspect-testing-apk.py build-output/HygeneOps-staff-2.1.3-ui.apk --api-url "$EXPO_PUBLIC_API_BASE_URL" --commit "$GITHUB_SHA" --output build-output/apk-inspection.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build-output/HygeneOps-staff-2.1.3-ui.apk > build-output/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 build-output/HygeneOps-staff-2.1.3-ui.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mobile-ui-apk
          path: frontend-mobile/build-output/
          if-no-files-found: warn
          retention-days: 7
