name: Android testing APK

on:
  push:
    branches: ['build/hygeneops-android-testing-*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend API URL reachable by the physical Android phone
        required: true
        default: http://10.54.199.4:8080/api
        type: string

permissions:
  contents: read

concurrency:
  group: android-testing-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || 'http://10.54.199.4:8080/api' }}

jobs:
  mobile-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-mobile
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - run: npm ci
      - name: Public physical-device configuration
        run: npm run validate:device-config
      - name: Mobile TypeScript and regression tests
        run: npm run typecheck && npm test
      - name: Expo compatibility and configuration
        run: |
          npx expo install --check
          npx --yes expo-doctor@1.20.4
          npx expo config --type prebuild --json > /tmp/expo-config.json
      - name: Android JavaScript and Hermes compilation
        run: npx expo export --platform android --output-dir /tmp/android-bundle-check
      - name: Whitespace check
        run: git diff-tree --check HEAD^ HEAD

  backend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: priv_verification_test
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: verification-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verification -d priv_verification_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://verification:verification-test-only@127.0.0.1:5432/priv_verification_test
      VERIFICATION_TEST_DATABASE_URL: postgresql://verification:verification-test-only@127.0.0.1:5432/priv_verification_test
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Backend contracts and build
        run: npm test && npm run build && npm run worker:verification:check
      - name: Isolated PostgreSQL contracts, lifecycle and worker health
        run: |
          npm run test:verification:integration
          npm run test:verification:lifecycle
          npm run test:verification:worker
      - name: Preserve closed evaluation gate
        run: npm run verification:benchmark

  android-apk:
    needs: [mobile-checks, backend-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      # Physical Android devices; omit emulator ABIs to reduce native build work.
      TEST_ANDROID_ABIS: arm64-v8a,armeabi-v7a
    defaults:
      run:
        working-directory: frontend-mobile
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            frontend-mobile/package-lock.json
            frontend-mobile/modules/**/build.gradle
      - name: Install exact Android SDK components on the hosted runner
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          df -h .
      - run: npm ci
      - name: Preserve native sources and resolve modules
        run: |
          npm run validate:device-config
          mkdir -p build-output
          # Apply current native plugins even when a generated directory exists.
          npx expo prebuild --platform android --no-install
          npx expo-modules-autolinking resolve --platform android --json > build-output/autolinking.json
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          modules = json.loads(Path('build-output/autolinking.json').read_text())['modules']
          names = {module['packageName'] for module in modules}
          required = {'capture-quality', 'spatial-tracking', 'expo-camera', 'expo-location',
                      'expo-sqlite', 'expo-secure-store', 'expo-file-system', 'expo-crypto'}
          assert required <= names, f'Missing native modules: {required - names}'
          model = Path('android/app/src/main/assets/clip-vision-int8.onnx')
          assert hashlib.sha256(model.read_bytes()).hexdigest() == '583fd1110a514667812fee7d684952aaf82a99b959760c8d7dca7e0ab9839299'
          assert 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3' in Path('android/build.gradle').read_text()
          assert 'expo.sqlite.useSQLCipher=true' in Path('android/gradle.properties').read_text()
          assert 'autoIdentityAcceptance:z.literal(false)' in Path('../backend/src/services/verification-v2/spatial.contracts.ts').read_text().replace(' ', '')
          cleanliness = Path('../backend/src/services/verification-v2/cleanliness.service.ts').read_text().replace(' ', '')
          assert 'returncleanlinessReleaseStatus(fixtureType,rubricVersion).allowed;' in cleanliness
          release = Path('../backend/src/services/verification-v2/cleanlinessRelease.ts').read_text().replace(' ', '')
          assert 'if(digest(bytes)!==pin)' in release
          assert 'Date.parse(record.review.expiresAt)<=now.getTime()' in release
          assert "reason:'CONFIGURATION_CHANGED'" in release
          assert 'verificationReleaseConfiguration()' in release
          print('Required native modules and SQLCipher resolved; spatial auto-acceptance is closed, and cleanliness remains behind its reviewed release gate.')
          PY
      - name: Compile native Android before APK packaging
        run: |
          cd android
          ./gradlew :app:compileReleaseSources :app:mergeReleaseNativeLibs :app:processReleaseMainManifest \
            -PreactNativeArchitectures="$TEST_ANDROID_ABIS" \
            --no-daemon --max-workers=2 --console=plain \
            2>&1 | tee ../build-output/native-compilation.log
          test ! -f app/build/outputs/apk/release/app-release.apk
      - name: Package standalone testing APK with the generated test signing key
        run: |
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures="$TEST_ANDROID_ABIS" \
            --no-daemon --max-workers=2 --console=plain \
            2>&1 | tee ../build-output/apk-build.log
          cp app/build/outputs/apk/release/app-release.apk ../build-output/HygeneOps-testing.apk
      - name: Inspect package, native code, permissions, signing and SHA-256
        run: |
          python3 scripts/inspect-testing-apk.py build-output/HygeneOps-testing.apk \
            --api-url "$EXPO_PUBLIC_API_BASE_URL" --commit "$GITHUB_SHA" \
            --output build-output/apk-inspection.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            build-output/HygeneOps-testing.apk | tee build-output/signature-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build-output/HygeneOps-testing.apk > build-output/zipalign-verification.txt
          cd build-output
          sha256sum HygeneOps-testing.apk > HygeneOps-testing.apk.sha256
          cat apk-inspection.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inspected testing APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HygeneOps-testing-apk
          path: |
            frontend-mobile/build-output/HygeneOps-testing.apk
            frontend-mobile/build-output/HygeneOps-testing.apk.sha256
            frontend-mobile/build-output/apk-inspection.json
            frontend-mobile/build-output/signature-verification.txt
            frontend-mobile/build-output/zipalign-verification.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-diagnostics
          path: |
            frontend-mobile/build-output/*.log
            frontend-mobile/build-output/autolinking.json
          if-no-files-found: ignore
          retention-days: 3
