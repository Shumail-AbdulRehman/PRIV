appId: ${APP_ID}
name: Consume an actual manager-issued one-use test credential
---
- launchApp:
    clearState: false
- tapOn: "Use manager access code"
- assertVisible: "Set your new password"
- tapOn: "Access code"
- inputText: ${E2E_ONE_USE_CODE}
- tapOn: "New password"
- inputText: ${E2E_REPLACEMENT_PASSWORD}
- tapOn: "Confirm new password"
- inputText: ${E2E_REPLACEMENT_PASSWORD}
- hideKeyboard
- tapOn: "Save new password"
- assertVisible: "Password replaced. Sign in with your new password."
- assertVisible: "Sign in"
