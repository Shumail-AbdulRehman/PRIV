appId: ${APP_ID}
name: Staff session survives app restart on an approved physical test device
---
- launchApp:
    clearState: false
- assertVisible: "Staff sign in"
- tapOn: "Email"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- assertVisible: "My day"
- stopApp
- launchApp:
    clearState: false
- assertVisible: "My day"
- assertNotVisible: "Staff sign in"
