appId: ${APP_ID}
name: Staff session survives app restart on an approved physical test device
---
- launchApp:
    clearState: false
- assertVisible: "staff@example.com"
- tapOn: "staff@example.com"
- inputText: ${E2E_EMAIL}
- tapOn: "Enter password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign In"
- assertVisible: "Today"
- stopApp
- launchApp:
    clearState: false
- assertVisible: "Today"
